source-file -q ~/dotfiles/theme/generated/tmux.theme.conf

# =============================================================================
# General
# =============================================================================

# Prefix key
set -g prefix C-t
unbind C-b

# Status bar position
set -g status-position top
set -g status on

# Terminal
set -g default-terminal 'screen-256color'
set -as terminal-features ',xterm-256color:RGB'

# Reduce keystroke delay
set -sg escape-time 1

# =============================================================================
# Status bar
# =============================================================================

set -gF status-style 'bg=#{@color_bg},fg=#{@color_fg}'
set -g status-interval 1

# First row keeps the prefix and clock; the second holds overflow windows.
# tmux has no native automatic wrap for its window list.
# Resize the status automatically as windows, names, or client width change.
# The updater adjusts each session independently; sourcing also refreshes existing sessions.
set-hook -g client-attached 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g client-detached 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g client-resized 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g client-session-changed 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g window-linked 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g window-unlinked 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g window-renamed 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g after-select-window 'run-shell -b "bash ~/bin/tmux-bin/tmux-status-windows --sync"'
run-shell -b 'bash ~/bin/tmux-bin/tmux-status-windows --sync'

set -g 'status-format[0]' '#{E:status-left}#{E:@tmux_window_row0}#[align=right]#{T:status-right}'
set -g 'status-format[1]' '   #{E:@tmux_window_row1}'

# Prefix indicator
set -g status-left '#[bg=#{@color_bg}]#{?client_prefix,#[fg=#{@color_prefix}],#[fg=#{@color_bg}]} ● '

# Active window
set -g window-status-current-format '#[fg=#{@color_white},bg=#{@color_active}] #I:#W '

# Inactive windows
set -g window-status-format '#[fg=#{@color_fg},bg=#{@color_inactive}] #I:#W '

# Date and time
set -g status-right '#[fg=#{@color_white},bg=#{@color_active}] [#{session_name}] %Y/%m/%d (%a) %H:%M '

# =============================================================================
# Pane appearance
# =============================================================================

set -gF pane-border-style 'fg=#{@color_accent}'
set -gF pane-active-border-style 'fg=#{@color_border_active}'

# =============================================================================
# Pane behavior
# =============================================================================

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes in the current directory
bind C-l split-window -h -c '#{pane_current_path}'
bind C-j split-window -v -c '#{pane_current_path}'
bind C-h split-window -h -c '#{pane_current_path}' \; swap-pane -U
bind C-k split-window -v -c '#{pane_current_path}' \; swap-pane -U

# Close pane
bind-key x kill-pane

# =============================================================================
# Copy mode
# =============================================================================

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

set-hook -g session-created 'run-shell "bash ~/bin/tmux-bin/tmux-renumber-sessions; bash ~/bin/tmux-bin/tmux-status-windows --sync"'
set-hook -g session-closed  'run-shell "bash ~/bin/tmux-bin/tmux-renumber-sessions"'

# Use terminal-native text selection instead of tmux mouse mode
set -g mouse off
