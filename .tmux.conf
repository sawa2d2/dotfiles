# =============================================================================
# Color palette
# =============================================================================

set -g @color_bg       '#1bafb5'  # Turquoise
set -g @color_fg       '#222222'  # Dark gray
set -g @color_accent   '#1bafb5'  # Turquoise
set -g @color_active   '#393939'  # Active window
set -g @color_inactive '#aaaaaa'  # Inactive window
set -g @color_white    '#f4f4f4'  # White

# =============================================================================
# General
# =============================================================================

# Prefix key
set -g prefix C-t
unbind C-b

# Status bar position
set -g status-position top

# Terminal
set -g default-terminal 'screen-256color'
set -as terminal-features ',xterm-256color:RGB'

# Reduce keystroke delay
set -sg escape-time 1

# =============================================================================
# Status bar
# =============================================================================

set -gF status-style 'bg=#{@color_bg},fg=#{@color_fg}'
set -g status-interval 1

# Prefix indicator
set -g status-left '#[bg=#{@color_bg}]#{?client_prefix,#[fg=#004144],#[fg=#{@color_bg}]} ● '

# Active window
set -g window-status-current-format '#[fg=#{@color_white},bg=#{@color_active}] #I:#W '

# Inactive windows
set -g window-status-format '#[fg=#{@color_fg},bg=#{@color_inactive}] #I:#W '

# Date and time
set -g status-right '#[fg=#{@color_white},bg=#{@color_active}] %Y/%m/%d (%a) %H:%M '

# =============================================================================
# Pane appearance
# =============================================================================

set -gF pane-border-style 'fg=#{@color_accent}'
set -g pane-active-border-style 'fg=#ffffff'

# =============================================================================
# Pane behavior
# =============================================================================

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes in the current directory
bind C-l split-window -h -c '#{pane_current_path}'
bind C-j split-window -v -c '#{pane_current_path}'
bind C-h split-window -h -c '#{pane_current_path}' \; swap-pane -U
bind C-k split-window -v -c '#{pane_current_path}' \; swap-pane -U

# Close pane
bind-key x kill-pane

# =============================================================================
# Copy mode
# =============================================================================

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
